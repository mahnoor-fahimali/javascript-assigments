<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern White Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    

    <div class="display">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>

  
    <div class="keypad">
      <button class="btn btn-action" onclick="clearAll()">C</button>
      <button class="btn btn-action" onclick="deleteChar()">⌫</button>
      <button class="btn btn-operator" onclick="appendOperator('/')">/</button>
      <button class="btn btn-operator" onclick="appendOperator('*')">*</button>


      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn btn-operator" onclick="appendOperator('-')">-</button>


      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn btn-operator btn-plus" onclick="appendOperator('+')">+</button>


      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn btn-equals" onclick="calculateResult()">=</button>

      <button class="btn btn-empty"></button>
      <button class="btn" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendDecimal('.')">.</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
