<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Form</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="box" id="formBox">
            <h2>Registration Form</h2>
            <p>Enter your details</p>

            <form onsubmit="return checkAddress();">
                <label>Full Name</label>
                <input type="text" id="nameField" placeholder="Enter your name">

                <label>Email Address</label>
                <input type="text" id="emailField" placeholder="Enter your email">

                <label>Phone Number</label>
                <input type="text" id="phoneField" placeholder="Enter your phone">

                <input type="submit" value="Submit Form">
            </form>
        </div>

        <div class="box card-box hidden" id="cardBox">
            <h3>User ID Card</h3>
            <div class="card-content">
                <p><strong>Name:</strong> <span id="displayName"></span></p>
                <p><strong>Email:</strong> <span id="displayEmail"></span></p>
                <p><strong>Phone:</strong> <span id="displayPhone"></span></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
